<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin Panel</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#102a56;
  color:white;
  padding:18px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logout{
  background:#dc2626;
  color:white;
  border:0;
  padding:10px 18px;
  border-radius:7px;
  cursor:pointer;
}

.container{
  max-width:1100px;
  margin:40px auto;
  padding:0 20px;
}

.login-box{
  max-width:420px;
  margin:80px auto;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.login-box h2{
  text-align:center;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:7px;
}

.login-btn{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:7px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.forgot-btn{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:0;
  background:none;
  color:#2563eb;
  cursor:pointer;
  font-weight:bold;
}

#adminPanel{
  display:none;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-bottom:25px;
}

.stat{
  background:white;
  padding:25px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.stat strong{
  display:block;
  font-size:30px;
  color:#2563eb;
  margin-top:10px;
}

.table-box{
  background:white;
  padding:20px;
  border-radius:15px;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,td{
  padding:13px;
  border-bottom:1px solid #eee;
  text-align:left;
}

th{
  background:#f8fafc;
}

.plan-select,
.task-input{
  padding:8px;
  border:1px solid #ddd;
  border-radius:6px;
}

.save-btn{
  background:#16a34a;
  color:white;
  border:0;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

.error{
  color:#dc2626;
  text-align:center;
  margin-top:12px;
}

.success{
  color:#16a34a;
  text-align:center;
  margin-top:12px;
}

@media(max-width:700px){

.stats{
  grid-template-columns:1fr;
}

header{
  padding:15px 5%;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
TASK PLATFORM — ADMIN
</div>

<button
class="logout"
id="logoutBtn"
style="display:none"
>
Logout
</button>

</header>


<!-- ADMIN LOGIN -->

<div
class="login-box"
id="loginBox"
>

<h2>🔐 Admin Login</h2>

<input
id="adminEmail"
type="email"
placeholder="Admin Email"
>

<input
id="adminPassword"
type="password"
placeholder="Password"
>

<button
class="login-btn"
id="loginBtn"
>
Login
</button>

<button
type="button"
class="forgot-btn"
id="forgotPasswordBtn"
>
Forgot Password?
</button>

<div
class="error"
id="loginError"
></div>

</div>


<!-- ADMIN PANEL -->

<div
class="container"
id="adminPanel"
>

<h1 style="margin-bottom:25px;">
Admin Dashboard
</h1>

<div class="stats">

<div class="stat">
Total Users
<strong id="totalUsers">0</strong>
</div>

<div class="stat">
Active Plans
<strong id="activePlans">0</strong>
</div>

<div class="stat">
Tasks Completed
<strong id="totalTasks">0</strong>
</div>

</div>


<div class="table-box">

<h2 style="margin-bottom:20px;">
Users
</h2>

<table>

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Plan</th>

<th>Tasks</th>

<th>Action</th>

</tr>

</thead>

<tbody id="userTable">

</tbody>

</table>

</div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword,
sendPasswordResetEmail,
signOut,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
setDoc
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:"AIzaSyAlAbRIsYXtc1EaYCC4adJ3WAHSL70w34I",

authDomain:"task-platform-a5d53.firebaseapp.com",

projectId:"task-platform-a5d53",

storageBucket:"task-platform-a5d53.firebasestorage.app",

messagingSenderId:"919403103005",

appId:"1:919403103005:web:429cc1df3e04067a5d97f4",

measurementId:"G-15BWD1378X"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ADMIN LOGIN */

document
.getElementById("loginBtn")
.onclick = async function(){

const email =
document
.getElementById("adminEmail")
.value
.trim();

const password =
document
.getElementById("adminPassword")
.value;


const errorBox =
document
.getElementById("loginError");

errorBox.className="error";
errorBox.innerText="";


if(!email || !password){

errorBox.innerText=
"Please enter email and password.";

return;

}


try{

const credential =
await signInWithEmailAndPassword(
auth,
email,
password
);

const uid =
credential.user.uid;


/* CHECK ADMIN */

const adminDoc =
await getDoc(
doc(db,"admins",uid)
);


if(!adminDoc.exists()){

await signOut(auth);

errorBox.innerText=
"This account is not an admin.";

return;

}


/* SHOW ADMIN PANEL */

document
.getElementById("loginBox")
.style.display="none";

document
.getElementById("adminPanel")
.style.display="block";

document
.getElementById("logoutBtn")
.style.display="block";


loadUsers();


}catch(error){

console.error(error);

errorBox.innerText=
"Login failed. Please check your email and password.";

}

};


/* FORGOT PASSWORD */

document
.getElementById("forgotPasswordBtn")
.onclick = async function(){

const email =
document
.getElementById("adminEmail")
.value
.trim();

const errorBox =
document
.getElementById("loginError");

errorBox.className="error";
errorBox.innerText="";


if(!email){

errorBox.innerText=
"Please enter your admin email first.";

return;

}


try{

await sendPasswordResetEmail(
auth,
email
);

errorBox.className="success";

errorBox.innerText=
"Password reset email sent. Please check your email.";

}catch(error){

console.error(error);

errorBox.className="error";

if(
error.code ===
"auth/user-not-found"
){

errorBox.innerText=
"No account found with this email.";

}
else if(
error.code ===
"auth/invalid-email"
){

errorBox.innerText=
"Please enter a valid email.";

}
else{

errorBox.innerText=
"Could not send reset email. Please try again.";

}

}

};


/* LOAD USERS */

async function loadUsers(){

const table =
document.getElementById("userTable");

table.innerHTML="";


let totalUsers=0;
let activePlans=0;
let totalTasks=0;


try{

const snapshot =
await getDocs(
collection(db,"users")
);


snapshot.forEach(function(userDoc){

const data =
userDoc.data();

totalUsers++;


if(data.plan){
activePlans++;
}


totalTasks +=
Number(data.tasks || 0);


const row =
document.createElement("tr");


row.innerHTML = `

<td>
${escapeHTML(data.name || "User")}
</td>

<td>
${escapeHTML(data.email || "")}
</td>

<td>

<select
class="plan-select"
id="plan-${userDoc.id}"
>

<option value="0">No Plan</option>

<option value="1">Plan 1</option>

<option value="2">Plan 2</option>

<option value="3">Plan 3</option>

</select>

</td>

<td>

<input
class="task-input"
id="tasks-${userDoc.id}"
type="number"
min="0"
max="10"
value="${Number(data.tasks || 0)}"
>

</td>

<td>

<button
class="save-btn"
>
Save
</button>

</td>

`;


table.appendChild(row);


document
.getElementById(
"plan-"+userDoc.id
)
.value =
String(data.plan || 0);


const saveButton =
row.querySelector(".save-btn");


saveButton.onclick =
function(){

saveUser(
userDoc.id,
data
);

};

});


document
.getElementById("totalUsers")
.innerText =
totalUsers;


document
.getElementById("activePlans")
.innerText =
activePlans;


document
.getElementById("totalTasks")
.innerText =
totalTasks;


}catch(error){

console.error(error);

alert(
"Could not load users: "+
error.message
);

}

}


/* SAVE USER */

async function saveUser(uid,data){

const plan =
Number(
document
.getElementById("plan-"+uid)
.value
);

const tasks =
Number(
document
.getElementById("tasks-"+uid)
.value
);


if(tasks < 0 || tasks > 10){

alert(
"Tasks must be between 0 and 10."
);

return;

}


try{

await setDoc(
doc(db,"users",uid),
{

name:data.name || "User",

email:data.email || "",

plan:plan,

tasks:tasks

},
{
merge:true
}
);


alert(
"User updated successfully!"
);

loadUsers();


}catch(error){

console.error(error);

alert(
"Update failed: "+
error.message
);

}

}


/* ESCAPE HTML */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* LOGOUT */

document
.getElementById("logoutBtn")
.onclick = async function(){

await signOut(auth);

document
.getElementById("adminPanel")
.style.display="none";

document
.getElementById("loginBox")
.style.display="block";

document
.getElementById("logoutBtn")
.style.display="none";

};


/* AUTH STATE */

onAuthStateChanged(
auth,
async function(firebaseUser){

if(!firebaseUser){

return;

}

try{

const adminDoc =
await getDoc(
doc(db,"admins",firebaseUser.uid)
);


if(adminDoc.exists()){

document
.getElementById("loginBox")
.style.display="none";

document
.getElementById("adminPanel")
.style.display="block";

document
.getElementById("logoutBtn")
.style.display="block";

loadUsers();

}

}catch(error){

console.error(error);

}

});

</script>

</body>
</html>
