```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Task Platform Admin</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
color:#172033;
}

/* HEADER */

header{
background:#102a56;
color:white;
padding:18px 7%;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
}

.logout{
background:#dc2626;
color:white;
border:0;
padding:10px 18px;
border-radius:7px;
cursor:pointer;
}

/* LOGIN */

.login-box{
max-width:420px;
margin:80px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.login-box h2{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:13px;
margin:8px 0;
border:1px solid #ddd;
border-radius:7px;
outline:none;
}

input:focus{
border-color:#2563eb;
}

.password-box{
position:relative;
}

.password-box input{
padding-right:50px;
}

.show-password{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
border:0;
background:none;
cursor:pointer;
font-size:19px;
}

.login-btn{
width:100%;
padding:13px;
margin-top:10px;
border:0;
border-radius:7px;
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
}

.login-btn:hover{
background:#1d4ed8;
}

.forgot-btn{
width:100%;
padding:10px;
margin-top:10px;
border:0;
background:none;
color:#2563eb;
cursor:pointer;
font-weight:bold;
}

.error{
color:#dc2626;
text-align:center;
margin-top:12px;
line-height:1.5;
}

.success{
color:#16a34a;
text-align:center;
margin-top:12px;
line-height:1.5;
}

/* ADMIN */

#adminPanel{
display:none;
}

.container{
max-width:1150px;
margin:35px auto;
padding:0 20px;
}

/* DASHBOARD */

.dashboard-title{
margin-bottom:25px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:25px;
}

.stat{
background:white;
padding:25px;
border-radius:12px;
text-align:center;
box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.stat strong{
display:block;
font-size:32px;
color:#2563eb;
margin-top:10px;
}

/* SEARCH */

.search-box{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.search-box input{
margin:0;
}

/* TABLE */

.table-box{
background:white;
padding:20px;
border-radius:15px;
overflow-x:auto;
box-shadow:0 4px 15px rgba(0,0,0,.05);
}

table{
width:100%;
border-collapse:collapse;
min-width:850px;
}

th,
td{
padding:13px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#f8fafc;
}

.plan-select,
.task-input{
padding:8px;
border:1px solid #ddd;
border-radius:6px;
}

.save-btn{
background:#16a34a;
color:white;
border:0;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
margin-right:5px;
}

.save-btn:hover{
background:#15803d;
}

.delete-btn{
background:#dc2626;
color:white;
border:0;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
}

.delete-btn:hover{
background:#b91c1c;
}

.no-users{
text-align:center;
padding:25px;
color:#777;
}

/* LOADING */

.loading{
text-align:center;
padding:25px;
color:#666;
}

/* MOBILE */

@media(max-width:700px){

header{
padding:15px 5%;
}

.logo{
font-size:17px;
}

.container{
padding:0 12px;
}

.stats{
grid-template-columns:1fr;
}

.stat{
padding:20px;
}

.table-box{
padding:12px;
}

}

</style>

</head>

<body>


<!-- HEADER -->

<header>

<div class="logo">
TASK PLATFORM — ADMIN
</div>

<button
class="logout"
id="logoutBtn"
style="display:none"
>
Logout
</button>

</header>


<!-- LOGIN -->

<div
class="login-box"
id="loginBox"
>

<h2>
🔐 Admin Login
</h2>

<input
id="adminEmail"
type="email"
placeholder="Admin Email"
autocomplete="email"
>

<div class="password-box">

<input
id="adminPassword"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<button
type="button"
class="show-password"
id="showPassword"
>
👁️
</button>

</div>

<button
class="login-btn"
id="loginBtn"
>
Login
</button>

<button
class="forgot-btn"
id="forgotPasswordBtn"
>
Forgot Password?
</button>

<div
class="error"
id="loginError"
></div>

</div>


<!-- ADMIN PANEL -->

<div
class="container"
id="adminPanel"
>

<h1 class="dashboard-title">
📊 Admin Dashboard
</h1>


<!-- STATS -->

<div class="stats">

<div class="stat">

Total Users

<strong id="totalUsers">
0
</strong>

</div>


<div class="stat">

Active Plans

<strong id="activePlans">
0
</strong>

</div>


<div class="stat">

Tasks Completed

<strong id="totalTasks">
0
</strong>

</div>

</div>


<!-- SEARCH -->

<div class="search-box">

<input
id="searchInput"
type="text"
placeholder="🔍 Search user by name or email..."
>

</div>


<!-- USERS -->

<div class="table-box">

<h2 style="margin-bottom:20px;">
👥 Users
</h2>

<table>

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Plan</th>

<th>Tasks</th>

<th>Action</th>

</tr>

</thead>

<tbody
id="userTable"
>

</tbody>

</table>

</div>

</div>


<script type="module">


/* FIREBASE */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword,
sendPasswordResetEmail,
signOut,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
setDoc,
deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey:"AIzaSyAlAbRIsYXtc1EaYCC4adJ3WAHSL70w34I",

authDomain:"task-platform-a5d53.firebaseapp.com",

projectId:"task-platform-a5d53",

storageBucket:"task-platform-a5d53.firebasestorage.app",

messagingSenderId:"919403103005",

appId:"1:919403103005:web:429cc1df3e04067a5d97f4",

measurementId:"G-15BWD1378X"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* USER CACHE */

let allUsers = [];


/* SHOW PASSWORD */

document
.getElementById("showPassword")
.onclick = function(){

const password =
document.getElementById("adminPassword");

if(password.type === "password"){

password.type = "text";

this.innerText = "🙈";

}else{

password.type = "password";

this.innerText = "👁️";

}

};


/* ERROR */

function showError(message){

const box =
document.getElementById("loginError");

box.className =
"error";

box.innerText =
message;

}


/* SUCCESS */

function showSuccess(message){

const box =
document.getElementById("loginError");

box.className =
"success";

box.innerText =
message;

}


/* FIREBASE ERROR */

function firebaseError(error){

console.error(error);

switch(error.code){

case "auth/invalid-credential":

return "❌ Email অথবা Password ভুল।";

case "auth/wrong-password":

return "❌ Password ভুল।";

case "auth/user-not-found":

return "❌ এই Email দিয়ে account পাওয়া যায়নি।";

case "auth/invalid-email":

return "❌ Email address সঠিক নয়।";

case "auth/user-disabled":

return "❌ Account disabled করা হয়েছে।";

case "auth/too-many-requests":

return "⚠️ অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";

case "auth/network-request-failed":

return "❌ Internet connection সমস্যা হয়েছে।";

default:

return "❌ " +
(error.message || error.code);

}

}


/* LOGIN */

document
.getElementById("loginBtn")
.onclick = async function(){

const email =
document
.getElementById("adminEmail")
.value
.trim();

const password =
document
.getElementById("adminPassword")
.value;


if(!email){

showError(
"❌ Admin Email দিন।"
);

return;

}


if(!password){

showError(
"❌ Password দিন।"
);

return;

}


const button =
document.getElementById("loginBtn");

button.disabled = true;

button.innerText =
"Logging in...";


try{

const credential =
await signInWithEmailAndPassword(
auth,
email,
password
);


const uid =
credential.user.uid;


/* CHECK ADMIN */

const adminDoc =
await getDoc(
doc(db,"admins",uid)
);


if(!adminDoc.exists()){

await signOut(auth);

showError(
"❌ এই account Admin হিসেবে অনুমোদিত নয়।"
);

return;

}


showAdmin();


}catch(error){

showError(
firebaseError(error)
);

}finally{

button.disabled = false;

button.innerText =
"Login";

}

};


/* FORGOT PASSWORD */

document
.getElementById("forgotPasswordBtn")
.onclick = async function(){

const email =
document
.getElementById("adminEmail")
.value
.trim();


if(!email){

showError(
"❌ প্রথমে Admin Email লিখুন।"
);

return;

}


try{

await sendPasswordResetEmail(
auth,
email
);

showSuccess(
"✅ Password reset email পাঠানো হয়েছে।"
);

}catch(error){

showError(
firebaseError(error)
);

}

};


/* SHOW ADMIN */

function showAdmin(){

document
.getElementById("loginBox")
.style.display =
"none";

document
.getElementById("adminPanel")
.style.display =
"block";

document
.getElementById("logoutBtn")
.style.display =
"block";

loadUsers();

}


/* LOAD USERS */

async function loadUsers(){

const table =
document.getElementById("userTable");

table.innerHTML =
'<tr><td colspan="5" class="loading">Loading users...</td></tr>';


try{

const snapshot =
await getDocs(
collection(db,"users")
);


allUsers = [];


snapshot.forEach(function(userDoc){

allUsers.push({

id:userDoc.id,

data:userDoc.data()

});

});


updateStats();

renderUsers(allUsers);


}catch(error){

console.error(error);

table.innerHTML =
`
<tr>
<td colspan="5" class="no-users">
❌ Users load করা যায়নি।<br><br>
${escapeHTML(error.message)}
</td>
</tr>
`;

}

}


/* UPDATE STATS */

function updateStats(){

let totalUsers =
allUsers.length;

let activePlans = 0;

let totalTasks = 0;


allUsers.forEach(function(user){

const data =
user.data;


if(
data.plan &&
Number(data.plan) > 0
){

activePlans++;

}


totalTasks +=
Number(data.tasks || 0);

});


document
.getElementById("totalUsers")
.innerText =
totalUsers;


document
.getElementById("activePlans")
.innerText =
activePlans;


document
.getElementById("totalTasks")
.innerText =
totalTasks;

}


/* RENDER USERS */

function renderUsers(users){

const table =
document.getElementById("userTable");

table.innerHTML = "";


if(users.length === 0){

table.innerHTML =
`
<tr>
<td colspan="5" class="no-users">
No users found.
</td>
</tr>
`;

return;

}


users.forEach(function(user){

const id =
user.id;

const data =
user.data;


const row =
document.createElement("tr");


row.innerHTML = `

<td>
${escapeHTML(data.name || "User")}
</td>

<td>
${escapeHTML(data.email || "")}
</td>

<td>

<select
class="plan-select"
id="plan-${id}"
>

<option value="0">No Plan</option>

<option value="1">Plan 1</option>

<option value="2">Plan 2</option>

<option value="3">Plan 3</option>

</select>

</td>

<td>

<input
class="task-input"
id="task-${id}"
type="number"
min="0"
max="10"
value="${Number(data.tasks || 0)}"
>

</td>

<td>

<button
class="save-btn"
>
Save
</button>

<button
class="delete-btn"
>
Delete
</button>

</td>

`;


table.appendChild(row);


document
.getElementById("plan-"+id)
.value =
String(data.plan || 0);


/* SAVE */

row
.querySelector(".save-btn")
.onclick =
function(){

saveUser(
id,
data
);

};


/* DELETE */

row
.querySelector(".delete-btn")
.onclick =
function(){

deleteUser(id);

};

});

}


/* SEARCH */

document
.getElementById("searchInput")
.addEventListener(
"input",
function(){

const search =
this.value
.toLowerCase()
.trim();


if(!search){

renderUsers(
allUsers
);

return;

}


const filtered =
allUsers.filter(function(user){

const data =
user.data;


const name =
String(
data.name || ""
)
.toLowerCase();


const email =
String(
data.email || ""
)
.toLowerCase();


return(
name.includes(search)
||
email.includes(search)
);

});


renderUsers(filtered);

});


/* SAVE USER */

async function saveUser(uid,data){

const plan =
Number(
document
.getElementById("plan-"+uid)
.value
);

const tasks =
Number(
document
.getElementById("task-"+uid)
.value
);


if(tasks < 0 || tasks > 10){

alert(
"Tasks অবশ্যই 0 থেকে 10 এর মধ্যে হতে হবে।"
);

return;

}


try{

await setDoc(

doc(
db,
"users",
uid
),

{

name:
data.name || "User",

email:
data.email || "",

plan:
plan,

tasks:
tasks

},

{
merge:true
}

);


alert(
"✅ User successfully updated!"
);


loadUsers();


}catch(error){

console.error(error);

alert(
"❌ Update failed:\n" +
error.message
);

}

}


/* DELETE USER */

async function deleteUser(uid){

const confirmDelete =
confirm(
"⚠️ আপনি কি সত্যিই এই User-এর Firestore data delete করতে চান?"
);


if(!confirmDelete){

return;

}


try{

await deleteDoc(
doc(
db,
"users",
uid
)
);


alert(
"✅ User data deleted!"
);


loadUsers();


}catch(error){

console.error(error);

alert(
"❌ Delete failed:\n" +
error.message
);

}

}


/* ESCAPE HTML */

function escapeHTML(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* LOGOUT */

document
.getElementById("logoutBtn")
.onclick =
async function(){

await signOut(auth);

document
.getElementById("adminPanel")
.style.display =
"none";

document
.getElementById("loginBox")
.style.display =
"block";

document
.getElementById("logoutBtn")
.style.display =
"none";

document
.getElementById("adminPassword")
.value =
"";

};


/* AUTH STATE */

onAuthStateChanged(
auth,
async function(firebaseUser){

if(!firebaseUser){

return;

}


try{

const adminDoc =
await getDoc(
doc(
db,
"admins",
firebaseUser.uid
)
);


if(adminDoc.exists()){

showAdmin();

}else{

await signOut(auth);

}

}catch(error){

console.error(
"Admin check error:",
error
);

}

});

</script>

</body>
</html>
```
